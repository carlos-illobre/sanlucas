<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P14 Documentación · Variante 3 · La cámara es la pantalla (celular)</title>
<link rel="stylesheet" href="../../../../common/common.css">
<style>
  /* ROMPE: sin barra de arriba ni de abajo, fondo oscuro de entrada, sin lista. */
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body { max-width: 390px; margin: 0 auto; height: 100vh; min-height: 720px; overflow: hidden; position: relative; background: #0E1620; color: #fff; }
  .visor { position: absolute; inset: 0; background: #2a1f18 url(../../shared/table-wood.jpg) center/cover; }
  .visor::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(14,22,32,.75) 0, rgba(14,22,32,0) 26%, rgba(14,22,32,0) 64%, rgba(14,22,32,.85) 100%); pointer-events: none; }

  /* Constelación: los 9 documentos como anillos */
  .arriba { position: absolute; top: 0; left: 0; right: 0; z-index: 5; padding: var(--sl-e3) var(--sl-e4) 0; }
  .fila1 { display: flex; align-items: center; gap: var(--sl-e2); }
  .fila1 .n { font: 700 24px/1 var(--sl-font-titulos); }
  .fila1 .n small { font: 500 14px/1 var(--sl-font-texto); opacity: .8; margin-left: 4px; }
  .fila1 .esp { flex: 1; }
  .redondo { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: rgba(14,22,32,.55); color: #fff; cursor: pointer; backdrop-filter: blur(8px); }
  .constel { display: flex; justify-content: space-between; margin-top: var(--sl-e3); }
  .astro { position: relative; width: 34px; height: 34px; border-radius: 50%; border: 0; padding: 0; display: grid; place-items: center; cursor: pointer; background: rgba(255,255,255,.08); color: rgba(255,255,255,.55); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); transition: transform var(--sl-dur) var(--sl-curva); }
  .astro svg { width: 16px; height: 16px; }
  .astro.listo { background: #3E9080; color: #fff; box-shadow: 0 0 0 3px rgba(111,224,196,.25); }
  .astro.obs { background: #E3A936; color: #1C1C1C; box-shadow: 0 0 0 3px rgba(227,169,54,.3); }
  .astro.recibe { animation: recibe 700ms cubic-bezier(.2,1.6,.4,1); }
  @keyframes recibe { 0% { transform: scale(1); } 40% { transform: scale(1.5); } 100% { transform: scale(1); } }
  .astro.objetivo { box-shadow: inset 0 0 0 2px #6FE0C4, 0 0 0 4px rgba(111,224,196,.25); color: #fff; }

  /* Papel en la mesa */
  .papel { position: absolute; left: 50%; top: 50%; width: 58%; z-index: 2; transform: translate(-50%, 140%) rotate(8deg); transition: transform 700ms var(--sl-curva), opacity var(--sl-dur); filter: drop-shadow(0 18px 22px rgba(0,0,0,.5)); }
  .papel.dni { width: 76%; }
  .papel svg { display: block; width: 100%; }
  .papel.entra { transform: translate(-50%, -52%) rotate(-4deg); }
  .papel.vuela { transition: transform 620ms cubic-bezier(.6,0,.3,1), opacity 620ms; opacity: 0; }
  .papel.gira { animation: gira 700ms var(--sl-curva); }
  @keyframes gira { 0% { transform: translate(-50%, -52%) rotate(-4deg) scaleX(1); } 50% { transform: translate(-50%, -52%) rotate(-4deg) scaleX(0); } 100% { transform: translate(-50%, -52%) rotate(-4deg) scaleX(1); } }
  .brillo { position: absolute; inset: 0; background: radial-gradient(ellipse 40% 30% at 65% 35%, rgba(255,255,255,.85), rgba(255,255,255,0) 70%); opacity: 0; transition: opacity var(--sl-dur-lenta); }
  .papel.reflejo .brillo { opacity: 1; }

  .contorno { position: absolute; left: 50%; top: 50%; width: 60%; aspect-ratio: 120/160; z-index: 3; transform: translate(-50%, -52%) rotate(-4deg) scale(1.15); border-radius: 10px; opacity: 0; box-shadow: 0 0 0 3px #6FE0C4; transition: opacity var(--sl-dur), transform var(--sl-dur-lenta) var(--sl-curva), box-shadow var(--sl-dur); }
  .contorno.dni { width: 80%; aspect-ratio: 160/104; }
  .contorno.ve { opacity: 1; transform: translate(-50%, -52%) rotate(-4deg) scale(1); }
  .contorno.alerta { box-shadow: 0 0 0 3px #FFC857; }

  .fantasma { position: absolute; left: 50%; top: 48%; width: 52%; aspect-ratio: 120/160; z-index: 1; transform: translate(-50%, -50%) rotate(-4deg); border: 2px dashed rgba(255,255,255,.55); border-radius: 12px; display: grid; place-content: center; justify-items: center; gap: var(--sl-e2); text-align: center; padding: var(--sl-e4); font-weight: 600; color: rgba(255,255,255,.9); background: rgba(14,22,32,.25); transition: opacity var(--sl-dur); animation: respira 2.6s ease-in-out infinite; }
  .fantasma span { font-size: 14px; font-weight: 500; opacity: .8; }
  .fantasma.oculto { opacity: 0; animation: none; }
  @keyframes respira { 0%, 100% { transform: translate(-50%, -50%) rotate(-4deg) scale(1); } 50% { transform: translate(-50%, -50%) rotate(-4deg) scale(1.03); } }
  /* Etiqueta que se pega al papel */
  .etiqueta { position: absolute; left: var(--sl-e4); right: var(--sl-e4); top: 136px; z-index: 6; background: #fff; color: var(--sl-texto); border-radius: 18px; padding: var(--sl-e3) var(--sl-e4); box-shadow: var(--sl-sombra-3); opacity: 0; transform: translateY(-8px) scale(.97); transition: opacity var(--sl-dur), transform var(--sl-dur) var(--sl-curva); pointer-events: none; }
  .etiqueta.ve { opacity: 1; transform: none; pointer-events: auto; }
  .etiqueta .l1 { display: flex; align-items: center; gap: var(--sl-e2); }
  .etiqueta .l1 b { flex: 1; font: 700 17px/1.2 var(--sl-font-titulos); color: var(--sl-azul-noche); }
  .etiqueta .porque { font-size: 14px; color: var(--sl-gris); margin-top: 2px; }
  .etiqueta .quienes { display: flex; gap: var(--sl-e2); margin-top: var(--sl-e3); }
  .etiqueta .quienes button { min-height: 40px; padding: 0 var(--sl-e3); border-radius: 999px; border: 1.5px solid var(--sl-borde); background: #fff; font: 600 15px/1 var(--sl-font-texto); color: var(--sl-azul-noche); display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .etiqueta .quienes button[aria-pressed="true"] { background: var(--sl-verde); border-color: var(--sl-verde); color: #fff; }
  .anillo-auto { width: 32px; height: 32px; transform: rotate(-90deg); flex: none; }
  .anillo-auto circle { fill: none; stroke-width: 4; }
  .anillo-auto .f { stroke: var(--sl-bruma); }
  .anillo-auto .v { stroke: var(--sl-verde); stroke-dasharray: 88; stroke-dashoffset: 88; }
  .anillo-auto.corre .v { transition: stroke-dashoffset 1.8s linear; stroke-dashoffset: 0; }

  /* Pista de calidad en vivo */
  .pista { position: absolute; left: 50%; bottom: 262px; z-index: 6; transform: translateX(-50%); display: inline-flex; align-items: center; gap: var(--sl-e2); padding: 10px var(--sl-e4); border-radius: 999px; background: rgba(14,22,32,.78); font-size: 15px; font-weight: 600; white-space: nowrap; backdrop-filter: blur(8px); transition: opacity var(--sl-dur); }
  .pista .p { width: 10px; height: 10px; border-radius: 50%; background: #6FE0C4; }
  .pista.alerta .p { background: #FFC857; }

  /* Abajo */
  .abajo { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; padding: 0 var(--sl-e4) var(--sl-e4); }
  .controles { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: var(--sl-e4); }
  .controles .der { justify-self: end; }
  .disparo { width: 76px; height: 76px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 4px; cursor: pointer; }
  .disparo span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform var(--sl-dur-rapida) var(--sl-curva); }
  .disparo:active span { transform: scale(.86); }
  .redondo.mic { width: 52px; height: 52px; }
  .redondo.mic.oye { background: #fff; color: var(--sl-verde); }
  .cajon { width: 100%; border: 0; border-radius: 18px; background: rgba(255,255,255,.12); backdrop-filter: blur(10px); color: #fff; display: flex; align-items: center; gap: var(--sl-e3); padding: var(--sl-e3) var(--sl-e4); font: inherit; text-align: left; cursor: pointer; }
  .cajon .agarre { position: absolute; }
  .cajon b { display: block; font-weight: 600; }
  .cajon span { font-size: 14px; opacity: .8; }
  .cajon .mini { display: flex; margin-left: auto; }
  .cajon .mini i { width: 28px; height: 34px; border-radius: 4px; border: 1.5px dashed rgba(255,255,255,.5); margin-left: -8px; background: rgba(14,22,32,.5); }
  .demo { display: block; margin: var(--sl-e3) auto 0; min-height: 40px; padding: 0 var(--sl-e4); border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: rgba(255,255,255,.85); font: 600 14px/1 var(--sl-font-texto); cursor: pointer; }
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 8; }
  .flash.va { animation: flash 380ms ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }

  /* Voz */
  .voz { position: absolute; inset: 0; z-index: 9; background: rgba(14,22,32,.88); display: grid; place-content: center; justify-items: center; gap: var(--sl-e5); text-align: center; padding: var(--sl-e8); opacity: 0; pointer-events: none; transition: opacity var(--sl-dur); }
  .voz.ve { opacity: 1; pointer-events: auto; }
  .onda { display: flex; gap: 6px; align-items: center; height: 56px; }
  .onda i { width: 6px; height: 56px; border-radius: 3px; background: #6FE0C4; transform: scaleY(.2); animation: onda 900ms ease-in-out infinite; }
  .onda i:nth-child(2) { animation-delay: .1s; } .onda i:nth-child(3) { animation-delay: .2s; } .onda i:nth-child(4) { animation-delay: .3s; } .onda i:nth-child(5) { animation-delay: .4s; }
  @keyframes onda { 0%, 100% { transform: scaleY(.2); } 50% { transform: scaleY(1); } }
  .voz p { opacity: .8; }
  .voz .dicho { font: 700 24px/1.3 var(--sl-font-titulos); min-height: 64px; }

  /* Cajón con lo que falta (claro: vuelve la calma) */
  .sl-hoja { max-width: 390px; margin: 0 auto; color: var(--sl-texto); max-height: 80vh; overflow: auto; padding-top: var(--sl-e3); }
  .agarre { width: 40px; height: 5px; border-radius: 3px; background: #D5DBDF; margin: 0 auto var(--sl-e4); }
  .hoja-cab { display: flex; align-items: center; margin-bottom: var(--sl-e3); }
  .hoja-cab h2 { flex: 1; }
  .icono-btn { width: 44px; height: 44px; display: grid; place-items: center; border: 0; background: transparent; color: var(--sl-azul-noche); border-radius: var(--sl-radio); cursor: pointer; }
  .falta { display: grid; grid-template-columns: 40px 1fr auto; gap: var(--sl-e3); align-items: center; padding: var(--sl-e3) 0; border-top: 1px solid var(--sl-borde); }
  .falta .th { width: 40px; height: 48px; border-radius: 6px; display: grid; place-items: center; overflow: hidden; border: 1.5px dashed #C3CBD1; color: var(--sl-gris); }
  .falta .th.lleno { border: 0; background: #F2F4F5; }
  .falta .th.lleno svg { width: 36px; }
  .falta b { display: block; font-weight: 600; }
  .falta span { font-size: 14px; color: var(--sl-gris); }
  .falta .sl-chip svg { width: 14px; height: 14px; }
  .salir { width: 100%; margin-top: var(--sl-e4); }
</style>
</head>
<body>
  <div class="visor" id="visor"></div>
  <div class="fantasma oculto" id="fantasma"><i data-icon="scan" data-size="32"></i>Apoyá el próximo papel acá<span>Cualquiera de la lista: nos damos cuenta cuál es</span></div>
  <div class="papel" id="papel"><div class="brillo"></div></div>
  <div class="contorno" id="contorno"></div>

  <div class="arriba">
    <div class="fila1">
      <span class="n" id="n">5<small>de 9 listos</small></span>
      <span class="esp"></span>
      <button class="redondo" id="linterna" aria-label="Linterna"><i data-icon="flashlight" data-size="20"></i></button>
      <button class="redondo" aria-label="Salir a mi postulación" data-ir="application-status"><i data-icon="x" data-size="20"></i></button>
    </div>
    <div class="constel" id="constel" aria-label="Documentos obligatorios"></div>
  </div>

  <div class="etiqueta" id="etiqueta" aria-live="polite"></div>
  <div class="pista" id="pista"><span class="p"></span><span id="pistaTx">Poné cualquier papel de la lista</span></div>

  <div class="abajo">
    <div class="controles">
      <button class="redondo mic" id="mic" aria-label="Hablar"><i data-icon="mic" data-size="24"></i></button>
      <button class="disparo" id="disparo" aria-label="Sacar foto ahora"><span></span></button>
      <button class="redondo mic der" id="archivo" aria-label="Subir un archivo"><i data-icon="image" data-size="24"></i></button>
    </div>
    <button class="cajon" id="cajon"><div><b id="cajonTit">Te faltan 3 y 1 para corregir</b><span>Tocá para ver cuáles · o pedíselos a tu familia</span></div><span class="mini"><i></i><i></i><i></i></span></button>
    <button class="demo" id="demo">Simular: poner otro papel en la mesa</button>
  </div>
  <div class="flash" id="flash"></div>

  <div class="voz" id="voz" role="dialog" aria-label="Escuchando">
    <div class="onda"><i></i><i></i><i></i><i></i><i></i></div>
    <p>Decí qué papel es, o qué querés hacer</p>
    <div class="dicho" id="dicho"></div>
    <button class="sl-btn oscuro" id="vozCerrar" style="background:rgba(255,255,255,.12);color:#fff">Cancelar</button>
  </div>

  <div class="sl-velo" id="velo"></div>
  <section class="sl-hoja" id="hoja" role="dialog" aria-modal="true"><div class="agarre"></div><div id="hojaCuerpo"></div></section>

  <script src="../../../../common/icons.js"></script>
  <script src="../../shared/documents.js"></script>
  <script src="../../../../common/navigate.js" defer></script>
  <script>
  (function () {
    var D = SLD, $ = function (s) { return document.querySelector(s); };
    /* La tanda que se simula: cada papel que se apoya en la mesa */
    var TANDA = [
      { id: 'rec-lautaro', nombre: 'Recibo de sueldo', porque: 'Es de Lautaro: es el único que cobra con recibo.', quienes: ['Lautaro'], reflejo: true },
      { id: 'dni-lautaro', nombre: 'DNI', porque: 'Leímos el código: Lautaro Benítez. Ahora dalo vuelta.', quienes: ['Lautaro'] },
      { id: 'ing-mirta', nombre: 'Declaración de ingresos', porque: '¿De quién son estos ingresos?', quienes: ['Mirta', 'Lautaro'], pregunta: true },
      { id: 'analitico', nombre: 'Analítico del secundario', porque: 'Reemplaza al que salió borroso.', quienes: ['Vos'] }
    ];
    var paso = 0, ocupado = false, tt = [];
    var ICON = { dni: 'id-card', cuil: 'file-text', analitico: 'graduation-cap', factura: 'receipt', ddjj: 'wallet', recibo: 'briefcase' };

    function constel(objetivo) {
      $('#constel').innerHTML = D.docs.filter(function (d) { return d.req; }).map(function (d) {
        var cls = D.isReady(d) ? 'listo' : d.state === 'observado' ? 'obs' : '';
        return '<button class="astro ' + cls + (objetivo === d.id ? ' objetivo' : '') + '" data-astro="' + d.id + '" aria-label="' + d.title + ': ' + D.STATES[d.state].label + '">' + slIcon(D.isReady(d) ? 'check' : ICON[d.kind] || 'file-text', 16) + '</button>';
      }).join('');
      var c = D.counts();
      $('#n').innerHTML = c.ready + '<small>de ' + c.total + ' listos</small>';
      var partes = []; if (c.missing) partes.push('Te ' + (c.missing === 1 ? 'falta 1' : 'faltan ' + c.missing)); if (c.fix) partes.push(c.fix + ' para corregir');
      $('#cajonTit').textContent = partes.length ? partes.join(' y ') : '¡Están todos!';
      $('#cajon').querySelector('.mini').innerHTML = new Array(Math.min(3, c.missing + c.fix) + 1).join('<i></i>');
    }
    function pista(tx, alerta) { $('#pistaTx').textContent = tx; $('#pista').classList.toggle('alerta', !!alerta); }
    function etiqueta(t) {
      var d = D.doc(t.id);
      $('#etiqueta').innerHTML = '<div class="l1"><b>' + t.nombre + '</b><svg class="anillo-auto" id="auto" viewBox="0 0 32 32"><circle class="f" cx="16" cy="16" r="14"/><circle class="v" cx="16" cy="16" r="14"/></svg></div><p class="porque">' + t.porque + '</p>' +
        '<div class="quienes">' + t.quienes.map(function (q, k) { return '<button aria-pressed="' + (!t.pregunta && k === 0) + '" data-quien="' + q + '">' + q + '</button>'; }).join('') + '</div>';
      $('#etiqueta').classList.add('ve');
    }
    function poner() {
      if (ocupado) return; var t = TANDA[paso]; if (!t) return fin();
      ocupado = true; $('#fantasma').classList.add('oculto'); var d = D.doc(t.id), dni = d.kind === 'dni';
      var p = $('#papel'), c = $('#contorno');
      p.className = 'papel' + (dni ? ' dni' : ''); p.innerHTML = D.art(d.kind) + '<div class="brillo"></div>';
      c.className = 'contorno' + (dni ? ' dni' : '');
      p.style.transform = ''; void p.offsetWidth;
      p.classList.add('entra'); pista('Buscando…');
      tt.push(setTimeout(function () {
        c.classList.add('ve'); constel(t.id); etiqueta(t);
        if (t.reflejo) { p.classList.add('reflejo'); c.classList.add('alerta'); pista('Hay un reflejo: inclinalo un poquito', true);
          tt.push(setTimeout(function () { p.classList.remove('reflejo'); c.classList.remove('alerta'); captura(t); }, 1800)); }
        else if (t.pregunta) { pista('Elegí de quién es y lo guardo'); }
        else captura(t);
      }, 800));
    }
    function captura(t) {
      var d = D.doc(t.id); pista('Quedate quieta…');
      var a = $('#auto'); if (a) a.classList.add('corre');
      tt.push(setTimeout(function () {
        var f = $('#flash'); f.classList.remove('va'); void f.offsetWidth; f.classList.add('va');
        if (d.kind === 'dni' && !t.dorso) { t.dorso = true; pista('Frente listo. Ahora el dorso');
          tt.push(setTimeout(function () { var p = $('#papel'); p.classList.add('gira'); if (a) { a.classList.remove('corre'); void a.getBBox(); }
            tt.push(setTimeout(function () { p.classList.remove('gira'); captura(t); }, 900)); }, 500)); return; }
        guardar(t);
      }, 1900));
    }
    function guardar(t) {
      var d = D.doc(t.id), astro = document.querySelector('[data-astro="' + t.id + '"]'), p = $('#papel');
      pista('¡Se lee perfecto! · 180 KB');
      var r = astro.getBoundingClientRect(), pr = p.getBoundingClientRect();
      var dx = r.left + r.width / 2 - (pr.left + pr.width / 2), dy = r.top + r.height / 2 - (pr.top + pr.height / 2);
      p.classList.add('vuela'); p.style.transform = 'translate(calc(-50% + ' + dx + 'px), calc(-52% + ' + dy + 'px)) scale(.06) rotate(-30deg)';
      $('#contorno').classList.remove('ve'); $('#etiqueta').classList.remove('ve');
      tt.push(setTimeout(function () {
        d.state = 'cargado'; d.when = '19/11'; constel();
        var a2 = document.querySelector('[data-astro="' + t.id + '"]'); a2.classList.add('recibe');
        pista(paso + 1 < TANDA.length ? 'Listo. Poné el próximo papel' : 'Listo. ¡Ya está todo!');
        paso++; ocupado = false; $('#fantasma').classList.remove('oculto');
        var c = D.counts(); if (c.ready === c.total) tt.push(setTimeout(fin, 900));
      }, 640));
    }
    function fin() {
      abrir('<div class="hoja-cab"><h2>¡Están todos, Camila!</h2></div><p class="sl-chico" style="margin-bottom:var(--sl-e4)">Los 9 obligatorios están cargados. Revisá todo y enviá tu postulación.</p><button class="sl-btn sl-btn-primario salir" data-ir="application-review">Revisar y enviar ' + slIcon('arrow-right', 20) + '</button>');
    }
    function abrir(h) { $('#hojaCuerpo').innerHTML = h; slRenderIcons($('#hoja')); $('#velo').classList.add('abierto'); $('#hoja').classList.add('abierta'); }
    function cerrar() { $('#velo').classList.remove('abierto'); $('#hoja').classList.remove('abierta'); }
    function cajon() {
      var ds = D.docs.slice().sort(function (a, b) { return (b.req - a.req) || (D.isReady(a) - D.isReady(b)); });
      abrir('<div class="hoja-cab"><h2>Tus documentos</h2><button class="icono-btn" data-cerrar aria-label="Cerrar">' + slIcon('x', 20) + '</button></div>' +
        ds.map(function (d) { var p = D.person(d.who); return '<div class="falta"><span class="th' + (d.state === 'pendiente' ? '' : ' lleno') + '">' + (d.state === 'pendiente' ? slIcon('file-up', 18) : D.art(d.kind, { blur: d.state === 'observado' ? 1.4 : 0 })) + '</span><div><b>' + d.title + '</b><span>' + (p.id === 'yo' ? 'Tuyo' : p.id === 'hogar' ? 'Del hogar' : p.name) + '</span></div>' + (!d.req && d.state === 'pendiente' ? '<span class="sl-chip neutro">Opcional</span>' : D.chip(d.state)) + '</div>'; }).join('') +
        '<button class="sl-btn sl-btn-secundario salir" data-cerrar>Seguir escaneando</button>');
    }
    function voz() {
      $('#voz').classList.add('ve'); $('#mic').classList.add('oye'); $('#dicho').textContent = '';
      var frase = '«Este es el recibo de mi hermano»', k = 0;
      var iv = setInterval(function () { k += 2; $('#dicho').textContent = frase.slice(0, k); if (k >= frase.length) { clearInterval(iv); tt.push(setTimeout(function () { cerrarVoz(); D.toast('Entendido: recibo de sueldo de Lautaro', 'mic'); }, 900)); } }, 60);
      tt.push(iv);
    }
    function cerrarVoz() { $('#voz').classList.remove('ve'); $('#mic').classList.remove('oye'); }

    document.addEventListener('click', function (e) {
      var t = e.target.closest('button'); if (!t || t.hasAttribute('data-ir')) return;
      if (t.id === 'demo') return poner();
      if (t.id === 'disparo') { if (!ocupado) return poner(); var tr = TANDA[paso]; if (tr && tr.pregunta) return; return; }
      if (t.id === 'cajon') return cajon();
      if (t.id === 'mic') return voz();
      if (t.id === 'vozCerrar') return cerrarVoz();
      if (t.id === 'archivo') return D.toast('Elegí fotos o PDF de la galería: los ordenamos solos.', 'image');
      if (t.id === 'linterna') { $('#visor').style.filter = $('#visor').style.filter ? '' : 'brightness(1.3)'; return; }
      if (t.hasAttribute('data-cerrar')) return cerrar();
      if (t.dataset.quien) {
        t.parentNode.querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', b === t); });
        var tr2 = TANDA[paso]; if (tr2 && tr2.pregunta && !tr2.resuelta) { tr2.resuelta = true; $('.porque').textContent = 'Ingresos de ' + t.dataset.quien + '. Guardando…'; captura(tr2); }
        return;
      }
      if (t.dataset.astro) { var d = D.doc(t.dataset.astro); return D.toast(d.title + ': ' + D.STATES[d.state].label.toLowerCase() + (d.state === 'observado' ? '. Ponelo en la mesa y lo reemplazamos.' : ''), D.STATES[d.state].icon); }
    });
    $('#velo').addEventListener('click', cerrar);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { cerrar(); cerrarVoz(); } if (e.key === ' ') { e.preventDefault(); poner(); } });
    constel();
    tt.push(setTimeout(poner, 900));
  })();
  </script>
</body>
</html>
